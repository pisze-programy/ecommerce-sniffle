name = "ecommerce-sniffle-backend"
main = "src/index.ts"
compatibility_date = "2026-08-23"

[triggers]
crons = ["0 2 * * *", "0 14 * * *"]

# Create the resources, then fill in the real ids:
#   npx wrangler d1 create ecommerce-sniffle
#   npx wrangler kv namespace create STATE
[[d1_databases]]
binding = "DB"
database_name = "ecommerce-sniffle"
database_id = "a13f1cc7-c52b-49b1-a9f2-e49894390a34"

[[kv_namespaces]]
binding = "STATE"
id = "a386d8fe723e4dff83578cf635e11dfa"

# cf-snitch email service (the same account). Worker-to-worker fetch via the URL fails
# with error 1042. The service binding routes internally without DNS.
[[services]]
binding = "SNITCH"
service = "cf-snitch"
